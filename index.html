<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a5a">
<link rel="manifest" href="manifest.json">
<title>Business Manager</title>
<style>
:root{--bg:#f4f5f3;--tx:#12202b;--mut:#5d6b76;--ln:#d9ddd9;--fld:#fff;--ac:#0b7a5a;--acx:#fff;--wa:#c2410c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--tx:#e8eef1;--mut:#97a6b0;--ln:#26343d;--fld:#16212a;--ac:#34c49a;--acx:#06251c;--wa:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f171d;--tx:#e8eef1;--mut:#97a6b0;--ln:#26343d;--fld:#16212a;--ac:#34c49a;--acx:#06251c;--wa:#fb923c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
p{margin:0}
.mut{color:var(--mut);font-size:.9rem}
header{padding:8px 0 18px}
#big{font:700 3rem/1.05 Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#sub{margin-top:2px}
#inst{margin-bottom:16px}
nav{display:flex;gap:6px;margin-bottom:18px}
nav button{flex:1;padding:11px 8px;border:1px solid var(--ln);border-radius:8px;background:transparent;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
h2{font-size:1.05rem;margin:22px 0 6px}
label{display:block;margin-bottom:12px;font-size:.9rem;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--fld);color:var(--tx);font:inherit;font-size:1rem}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.pri{width:100%;padding:13px;border:0;border-radius:8px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;cursor:pointer}
.msg{min-height:1.4em;margin-top:8px;color:var(--mut);font-size:.9rem}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--ln)}
li small{color:var(--mut)}
li.warn{color:var(--wa);justify-content:flex-start}
li.none{color:var(--mut);justify-content:flex-start}
.r{display:flex;gap:6px;align-items:center}
li button,.row button{padding:7px 10px;border:1px solid var(--ln);border-radius:8px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.b{font-style:normal;font-weight:700;min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.b.w{color:var(--wa)}
summary{margin-top:22px;font-weight:600;cursor:pointer}
details{margin-bottom:18px}
details .row{display:flex;gap:8px;margin-top:8px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
<p id="big">0 $</p>
<p class="mut">de bénéfice aujourd’hui</p>
<p class="mut" id="sub"></p>
</header>
<button class="pri" id="inst" hidden>Installer l’application</button>
<nav>
<button data-t="vendre">Vendre</button>
<button data-t="stock" id="tstock">Stock</button>
<button data-t="jour">Journée</button>
</nav>

<section id="vendre">
<label>Produit<select id="sp"></select></label>
<label>Quantité<input id="sq" type="number" inputmode="numeric" min="1" value="1"></label>
<button class="pri" id="sell">Enregistrer la vente</button>
<p class="msg" id="smsg" role="status"></p>
</section>

<section id="stock" hidden>
<div class="two">
<label>Nom du produit<input id="pn" autocomplete="off"></label>
<label>Quantité en stock<input id="pq" inputmode="numeric"></label>
<label>Prix d’achat<input id="pb" inputmode="decimal"></label>
<label>Prix de vente<input id="ps" inputmode="decimal"></label>
<label>Alerte quand il reste<input id="pm" inputmode="numeric" placeholder="3"></label>
</div>
<button class="pri" id="add">Ajouter le produit</button>
<p class="msg" id="pmsg" role="status"></p>
<ul id="plist"></ul>
</section>

<section id="jour" hidden>
<h2>Alertes</h2>
<ul id="alerts"></ul>
<h2>Ventes d’aujourd’hui</h2>
<ul id="slist"></ul>
<details>
<summary>Devise et sauvegarde</summary>
<label>Devise<input id="cur" maxlength="6"></label>
<p class="mut">Vos données restent sur ce téléphone. Copiez la sauvegarde de temps en temps pour ne rien perdre.</p>
<textarea id="bk" rows="4" aria-label="Texte de sauvegarde"></textarea>
<div class="row"><button id="copy">Copier la sauvegarde</button><button id="rest">Restaurer</button></div>
<p class="msg" id="bmsg" role="status"></p>
</details>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
let S={cur:"$",products:[],sales:[]};
try{const r=localStorage.getItem("bm1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("bm1",JSON.stringify(S))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:NaN};
const fmt=n=>n.toLocaleString("fr-FR",{maximumFractionDigits:2})+" "+S.cur;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=t=>new Date(t).toDateString()===new Date().toDateString();

function show(t){
  document.querySelectorAll("section").forEach(s=>s.hidden=s.id!==t);
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));

function render(){
  const ts=S.sales.filter(s=>today(s.t));
  const ca=ts.reduce((a,s)=>a+s.rev,0), pr=ts.reduce((a,s)=>a+s.profit,0);
  $("#big").textContent=fmt(pr);
  $("#sub").textContent=ts.length?ts.length+(ts.length>1?" ventes":" vente")+", "+fmt(ca)+" encaissés":"Aucune vente aujourd’hui";
  const low=S.products.filter(p=>p.qty<=p.min);
  $("#tstock").textContent=low.length?"Stock ("+low.length+")":"Stock";
  $("#cur").value=S.cur;

  const sel=$("#sp"),v=sel.value,inStock=S.products.filter(p=>p.qty>0);
  sel.innerHTML=inStock.length?inStock.map(p=>`<option value="${p.id}">${esc(p.name)} (reste ${p.qty}), ${fmt(p.sell)}</option>`).join(""):'<option value="">Aucun produit en stock</option>';
  if(inStock.some(p=>p.id===v))sel.value=v;

  $("#plist").innerHTML=S.products.length?S.products.map(p=>`<li><span><b>${esc(p.name)}</b><br><small>Achat ${fmt(p.buy)}, vente ${fmt(p.sell)}</small></span><span class="r"><i class="${p.qty<=p.min?"b w":"b"}">${p.qty}</i><button data-id="${p.id}" data-a="-1" aria-label="Retirer 1">−1</button><button data-id="${p.id}" data-a="1" aria-label="Ajouter 1">+1</button><button data-id="${p.id}" data-a="10" aria-label="Ajouter 10">+10</button><button data-id="${p.id}" data-a="d" aria-label="Supprimer">🗑</button></span></li>`).join(""):'<li class="none">Aucun produit pour l’instant. Ajoutez le premier ci-dessus.</li>';

  $("#alerts").innerHTML=low.length?low.map(p=>`<li class="warn">${p.qty<=0?"Rupture":"Stock bas"} : <b>${esc(p.name)}</b> (reste ${p.qty})</li>`).join(""):'<li class="none">Aucune alerte pour le moment.</li>';

  $("#slist").innerHTML=ts.length?ts.slice().reverse().map(s=>`<li><span>${esc(s.name)} × ${s.qty}<br><small>${fmt(s.rev)} encaissés, ${fmt(s.profit)} de bénéfice</small></span><button data-undo="${s.id}">Annuler</button></li>`).join(""):'<li class="none">Aucune vente aujourd’hui.</li>';
}

$("#sell").onclick=()=>{
  const p=S.products.find(x=>x.id===$("#sp").value),q=Math.floor(num($("#sq").value)),m=$("#smsg");
  if(!p){m.textContent="Ajoutez d’abord un produit dans l’onglet Stock.";return}
  if(!(q>0)){m.textContent="Entrez une quantité d’au moins 1.";return}
  if(q>p.qty){m.textContent="Stock insuffisant : il en reste "+p.qty+".";return}
  p.qty-=q;
  S.sales.push({id:uid(),pid:p.id,name:p.name,qty:q,rev:q*p.sell,profit:q*(p.sell-p.buy),t:Date.now()});
  save();$("#sq").value=1;render();
  m.textContent="Vente enregistrée : "+fmt(q*p.sell);
};

$("#add").onclick=()=>{
  const n=$("#pn").value.trim(),b=num($("#pb").value),s=num($("#ps").value),q=Math.floor(num($("#pq").value)),mn=Math.floor(num($("#pm").value)),m=$("#pmsg");
  if(!n||isNaN(b)||isNaN(s)||isNaN(q)){m.textContent="Remplissez le nom, la quantité, le prix d’achat et le prix de vente.";return}
  S.products.push({id:uid(),name:n,buy:b,sell:s,qty:q,min:isNaN(mn)?3:mn});
  save();["pn","pb","ps","pq","pm"].forEach(i=>$("#"+i).value="");
  render();m.textContent="Produit ajouté.";
};

$("#plist").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const p=S.products.find(x=>x.id===b.dataset.id);if(!p)return;
  if(b.dataset.a==="d"){
    if(!b.dataset.c){b.dataset.c=1;b.textContent="Confirmer";return}
    S.products=S.products.filter(x=>x!==p);
  }else p.qty=Math.max(0,p.qty+Number(b.dataset.a));
  save();render();
};

$("#slist").onclick=e=>{
  const b=e.target.closest("[data-undo]");if(!b)return;
  const i=S.sales.findIndex(s=>s.id===b.dataset.undo);if(i<0)return;
  const s=S.sales[i],p=S.products.find(x=>x.id===s.pid);
  if(p)p.qty+=s.qty;
  S.sales.splice(i,1);save();render();
};

$("#cur").onchange=()=>{S.cur=$("#cur").value.trim()||"$";save();render()};

$("#copy").onclick=async()=>{
  const t=$("#bk");t.value=JSON.stringify(S);t.select();
  let ok=false;
  try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){try{ok=document.execCommand("copy")}catch(e2){}}
  $("#bmsg").textContent=ok?"Sauvegarde copiée. Collez-la dans une note ou un message à vous-même.":"Appuyez longuement sur le texte ci-dessus pour le copier.";
};

$("#rest").onclick=()=>{
  try{
    const d=JSON.parse($("#bk").value);
    if(!Array.isArray(d.products)||!Array.isArray(d.sales))throw 0;
    S={cur:d.cur||"$",products:d.products,sales:d.sales};
    save();render();$("#bmsg").textContent="Données restaurées.";
  }catch(e){$("#bmsg").textContent="Ce texte n’est pas une sauvegarde valide. Collez-le dans le cadre ci-dessus."}
};

let dp=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("#inst").hidden=false});
$("#inst").onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$("#inst").hidden=true};
window.addEventListener("appinstalled",()=>{$("#inst").hidden=true});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

show("vendre");render();
</script>
</body>
</html>
